[project]
name = "pricinglibrary-rag-backend"
version = "0.1.0"
description = "Local RAG backend for ThePricingLibrary course and practical exercise generation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "openai>=2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
