[build-system]
requires = ["setuptools>=68", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "pricinglibrary-rag-backend"
version = "0.1.0"
description = "Local RAG backend for ThePricingLibrary course and practical exercise generation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2",
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "openai>=2.0",
  "stripe>=9",
  "PyJWT[crypto]>=2.8"
]

[project.scripts]
tpl = "pricinglibrary_rag.learner_cli:main"

[tool.setuptools.package-data]
pricinglibrary_rag = ["learner_examples.json", "js/*.mjs", "js/*.json", "learning_assets/*.json"]

[tool.setuptools.packages.find]
include = ["pricinglibrary_rag*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
